name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit01:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: audit01-hormuz
        run: pip install -q -r requirements.txt

      - name: Run audit01-hormuz pipeline
        working-directory: audit01-hormuz
        run: bash run.sh

      - name: Verify derived outputs
        working-directory: audit01-hormuz
        run: |
          test -f derived/key_numbers.json
          test -f derived/monthly_mass_balance.csv
          test -f derived/audit01_chart.png

      - name: Upload derived artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit01-derived
          path: audit01-hormuz/derived/
          if-no-files-found: ignore
